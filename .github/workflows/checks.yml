name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        env:
          FIREBASE_WEB_CONFIG: '{"apiKey":"demo-key","authDomain":"demo-slime-castle.firebaseapp.com","projectId":"demo-slime-castle","storageBucket":"demo-slime-castle.firebasestorage.app","messagingSenderId":"123","appId":"1:123:web:demo"}'
